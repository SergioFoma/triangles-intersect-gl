# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches:
      #- 'main'
      - 'dev'
  pull_request:
    branches:
      #- 'main'
      - 'dev'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    # ----------------------------------------------------------------
    # 1. LINUX (Ubuntu): Быстрая установка через apt-get
    # ----------------------------------------------------------------
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Устанавливаем OpenGL (Mesa), GLFW и TBB
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev xorg-dev libglfw3-dev libtbb-dev

    # ----------------------------------------------------------------
    # 2. WINDOWS: Кэширование и установка через vcpkg
    # ----------------------------------------------------------------
    - name: Restore vcpkg Cache (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v4
      with:
        path: |
          ~/.vcpkg
          C:/vcpkg/downloads
          C:/vcpkg/installed
        key: ${{ runner.os }}-vcpkg-glfw-tbb-v2
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    # Системный OpenGL на Windows встроен по умолчанию в Windows SDK.
    # Через vcpkg ставим только GLFW и TBB.
    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install glfw3:x64-windows
        vcpkg install tbb:x64-windows

    # MSVC-окружение + Ninja вместо MSBuild: заметно ускоряет сборку на Windows
    # (MSBuild переключается между конфигурациями и хуже параллелит компиляцию).
    - name: Setup MSVC dev environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # ----------------------------------------------------------------
    # Windows: glfw3/TBB ставятся через vcpkg, поэтому нужен его toolchain-файл,
    # иначе find_package(glfw3) проваливается на Configure.
    # ----------------------------------------------------------------
    - name: Compute extra CMake args
      id: extra
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          echo "toolchain=-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_OUTPUT"
        else
          echo "toolchain=" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure CMake
      # Ninja (одно-конфигурационный генератор) + BUILD_TESTING для юнит и e2e тестов
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTING=ON
        ${{ steps.extra.outputs.toolchain }}
        -S ${{ github.workspace }}

    - name: Build
      # Собираем только нужные цели: приложение, юнит-тесты и end-to-end.
      # benchmark_test намеренно не собирается (он не запускается в CI) — экономия времени.
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --parallel
        --target triangle_intersect triangles_tests end_to_end_testing

    # End-to-end: статусы пересечений по всем файлам в materials/ — обязательный шаг.
    # Программа сама вычисляет путь к materials/ относительно себя — запускать можно откуда угодно.
    - name: Run end-to-end tests
      shell: bash
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}/bin
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./end_to_end_testing.exe
        else
          ./end_to_end_testing
        fi

    # Юнит-тесты Google Test. continue-on-error: в группе InterAnalyzer/Triangle3D
    # есть устаревшие/падающие тесты — шаг нужен, чтобы видеть статус,
    # но он не блокирует CI, пока тесты не приведены в порядок.
    - name: Run unit tests (Google Test)
      shell: bash
      continue-on-error: true
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}/bin
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./triangles_tests.exe
        else
          ./triangles_tests
        fi
