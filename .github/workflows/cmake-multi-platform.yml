name: CMake on multiple platforms

on:
  push:
    branches:
      - 'dev'
  pull_request:
    branches:
      - 'dev'

# Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон —
# не тратим раннеры на устаревшие коммиты.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # ----------------------------------------------------------------
    # LINUX: apt-зависимости + ccache (переиспользуем компиляцию между
    # прогонами: меняется только то, что реально перекомпилировано).
    # ----------------------------------------------------------------
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libgl1-mesa-dev libglu1-mesa-dev xorg-dev libglfw3-dev libtbb-dev

    - name: Restore ccache (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ matrix.c_compiler }}-${{ github.run_id }}
        restore-keys: ccache-${{ matrix.c_compiler }}-

    # ----------------------------------------------------------------
    # WINDOWS: vcpkg с бинарным кэшем x-gha. Провайдер x-gha сохраняет
    # каждое собранное бинарное средство пакета отдельным GitHub-кэшем:
    # после первого прогона glfw3/tbb скачиваются готовыми за секунды,
    # без пересборки из исходников и без тяжёлого кэша всего /vcpkg.
    # ----------------------------------------------------------------
    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        vcpkg install glfw3:x64-windows tbb:x64-windows

    # MSVC-окружение + Ninja вместо MSBuild — заметно быстрее.
    - name: Setup MSVC dev environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # ----------------------------------------------------------------
    # Кэш исходников FetchContent (CLI11, GTest): не качаем zip каждый раз.
    # ----------------------------------------------------------------
    - name: Restore FetchContent sources
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/fc-src
        key: fc-src-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          fc-src-${{ matrix.os }}-${{ matrix.c_compiler }}-
          fc-src-

    # ----------------------------------------------------------------
    # Общие аргументы cmake:
    #  - тесты ON, benchmark OFF (в CI он не нужен — проект разделил опции);
    #  - Linux: ccache как ланчер компилятора;
    #  - Windows: toolchain vcpkg;
    #  - FetchContent кладёт исходники в кэшируемый fc-src.
    # ----------------------------------------------------------------
    - name: Compute extra CMake args
      id: extra
      shell: bash
      run: |
        base="-DBUILD_TESTING=ON -DBUILD_BENCHMARK=OFF -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/fc-src"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          echo "cmake_args=${base} -DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_OUTPUT"
        else
          echo "cmake_args=${base} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ steps.extra.outputs.cmake_args }}
        -S ${{ github.workspace }}

    - name: Build
      # benchmark_test не собирается (BUILD_BENCHMARK=OFF) — в CI он не нужен.
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --parallel
        --target triangle_intersect triangles_tests end_to_end_testing

    # Кэш FetchContent-исходников обновляем после успешной сборки.
    - name: Save FetchContent sources
      if: success()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/fc-src
        key: fc-src-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ hashFiles('**/CMakeLists.txt') }}

    # End-to-end: обязательный (все 6 пар файлов из materials/ проходят).
    # Программа сама вычисляет путь к materials/ относительно себя.
    - name: Run end-to-end tests
      shell: bash
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}/bin
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./end_to_end_testing.exe
        else
          ./end_to_end_testing
        fi

    # Юнит-тесты Google Test. continue-on-error: часть тестов устарела и
    # допиливается отдельно — шаг показывает статус, но не блокирует CI.
    - name: Run unit tests (Google Test)
      shell: bash
      continue-on-error: true
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}/bin
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./triangles_tests.exe
        else
          ./triangles_tests
        fi

    # ccache сохраняем в конце (только Linux): даже если тесты «красные»,
    # кэш полезного состояния сборки успевает записаться.
    - name: Save ccache (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ matrix.c_compiler }}-${{ github.run_id }}
